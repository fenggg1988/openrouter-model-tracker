# schedule re-registered 2026-09-26 (fix: cron lost after account flag)
name: Daily OpenRouter Model Stats

# 每日云端抓取 OpenRouter 各家模型调用量，更新 model_stats.json / model_stats.html 并推回仓库。
# 北京时间 09:00 = UTC 01:00；同时支持手动触发（Actions 页 -> Run workflow）。
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: "内部使用：链式调度传来的标记，勿手动填写"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run scraper
        run: python scrape_openrouter.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily OpenRouter model stats update [skip ci]"
            git pull --rebase --autostash origin "$(git branch --show-current)" || true
            git push
          fi

      # 兜底：schedule 不可靠（GitHub 免费版常延迟数小时）。
      # 注意：GITHUB_TOKEN 无法触发 workflow_dispatch（防递归），必须用 PAT(CHAIN_TOKEN)。
      # 每次成功后主动触发下一个项目，形成自链式调度。
      - name: Trigger next project (chain)
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CHAIN_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/purr-mnav-tracker/actions/workflows/update.yml/dispatches \
            -d '{"ref":"main","inputs":{"chain":"1"}}' || true
