name: Daily OpenRouter Model Stats

# 每日云端抓取 OpenRouter 各家模型调用量，更新 model_stats.json / model_stats.html 并推回仓库。
# 北京时间 09:00 = UTC 01:00；同时支持手动触发（Actions 页 -> Run workflow）。
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run scraper
        run: python scrape_openrouter.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily OpenRouter model stats update [skip ci]"
            git push
          fi
