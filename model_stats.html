  .bar-fill { height: 100%; border-radius: 6px; }
  .bar-val { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }

  .trend svg { width: 100%; height: 160px; display: block; }
  .trend .grid line { stroke: var(--line); stroke-width: 1; }
  .trend .axis { fill: var(--muted); font-size: 10px; }

  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }

  td.num { font-variant-numeric: tabular-nums; }

  const a = Math.abs(n);
  if (a >= 1e12) return (n/1e12).toFixed(2) + "T";
  if (a >= 1e9)  return (n/1e9 ).toFixed(2) + "B";
  if (a >= 1e6)  return (n/1e6 ).toFixed(2) + "M";
  if (a >= 1e3)  return (n/1e3 ).toFixed(1) + "K";
  return String(n);
}
// stable color per provider
const PALETTE = ["#4f46e5","#0ea5e9","#10b981","#f59e0b","#ef4444","#8b5cf6",
                 "#ec4899","#14b8a6","#f97316","#6366f1","#84cc16","#e11d48","#0891b2","#a855f7"];
const provColor = (() => {
  const map = {}; let i = 0;
  return (p) => { if (!(p in map)) map[p] = PALETTE[i++ % PALETTE.length]; return map[p]; };
})();

// ---------- state ----------
let DATA = EMBEDDED_DATA;
let dates = [];
let latest = null;
let rows = [];
let state = { search:"", provider:"__all__", sort:"count", topn:15, dir:-1 };

function init(){
  if (!DATA || !DATA.history) { $("updated").textContent = "暂无数据，请先运行抓取脚本。"; return; }
  dates = Object.keys(DATA.history).sort();
  latest = dates[dates.length - 1];
  rows = DATA.history[latest] || [];
  $("updated").textContent = "数据日期 " + latest + " · 更新于 " + (DATA.last_updated || "—");
  buildProviderOptions();
  renderCards();
  renderBars();
  renderTrend();
  renderTable();
}

function buildProviderOptions(){
  const set = new Set(rows.map(r => r.provider));
  const sel = $("provider");
  sel.innerHTML = '<option value="__all__">全部厂商</option>' +
    [...set].sort().map(p => `<option value="${p}">${p}</option>`).join("");
}

function filtered(){
  let f = rows.slice();
  if (state.provider !== "__all__") f = f.filter(r => r.provider === state.provider);
  if (state.search){
    const q = state.search.toLowerCase();
    f = f.filter(r => (r.model_name+" "+r.provider+" "+r.model_permaslug).toLowerCase().includes(q));
  }
  const k = state.sort;
  f.sort((a,b)=>{
    let av = a[k], bv = b[k];
    if (typeof av === "string"){ return state.dir * av.localeCompare(bv); }
    return state.dir * ((av||0) - (bv||0));
  });
  return f;
}

// ---------- cards ----------
function renderCards(){
  const totalCalls = rows.reduce((s,r)=>s+(r.count||0),0);
  const totalPt = rows.reduce((s,r)=>s+(r.prompt_tokens||0),0);
  const totalCt = rows.reduce((s,r)=>s+(r.completion_tokens||0),0);
  const provs = new Set(rows.map(r=>r.provider)).size;
  const top = rows.slice().sort((a,b)=>(b.count||0)-(a.count||0))[0];
  const cards = [
    {k:"追踪模型数（当日）", v: fmtInt(rows.length)},
    {k:"总调用次数", v: fmtCompact(totalCalls), s:"≈ "+fmtInt(totalCalls)},
    {k:"总 Prompt Tokens", v: fmtCompact(totalPt), s:"≈ "+fmtInt(totalPt)},
    {k:"活跃厂商 / 头部模型", v: provs+" 家", s: (top? top.model_name : "—")},
  ];
  $("cards").innerHTML = cards.map(c=>
    `<div class="card"><div class="k">${c.k}</div><div class="v">${c.v} ${c.s?`<small>${c.s}</small>`:""}</div></div>`
  ).join("");
}

// ---------- bar chart ----------
function renderBars(){
  const f = filtered().slice(0, state.topn === 9999 ? 25 : state.topn);
  $("barTag").textContent = "（Top "+ (state.topn===9999?25:state.topn) +" 按当前筛选）";
  if (!f.length){ $("bars").innerHTML = '<div class="legend">无匹配数据</div>'; return; }
  const max = Math.max(...f.map(r=>r.count||0));
  $("bars").innerHTML = f.map(r=>{
    const w = max ? (100*(r.count||0)/max) : 0;
    const c = provColor(r.provider);
    return `<div class="bar-row">
      <div class="bar-label" title="${r.model_permaslug}">${r.model_name}<br><span class="prov">${r.provider_alias||r.provider}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${c}"></div></div>
      <div class="bar-val">${fmtCompact(r.count)}</div>
    </div>`;
  }).join("") + `<div class="legend">柱长按调用次数比例缩放；颜色区分厂商。</div>`;
}

// ---------- trend ----------
function renderTrend(){
  const totals = dates.map(d => DATA.history[d].reduce((s,r)=>s+(r.count||0),0));
  $("trendTag").textContent = "（"+dates.length+" 天）";
  if (dates.length < 1){ $("trend").innerHTML=""; return; }
  const W=1000, H=160, padL=8, padR=8, padT=12, padB=22;
  const max = Math.max(...totals, 1);
  const n = totals.length;
  const x = i => padL + (W-padL-padR) * (n===1?0.5:i/(n-1));
  const y = v => padT + (H-padT-padB) * (1 - v/max);
  let pts = totals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let labels = dates.map((d,i)=>{
    const tx = x(i);
    const short = d.slice(5);
    return `<text class="axis" x="${tx.toFixed(1)}" y="${H-6}" text-anchor="middle">${short}</text>`;
  }).join("");
  const areaPts = `${padL},${H-padB} ${pts} ${(W-padR).toFixed(1)},${H-padB}`;
  $("trend").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${areaPts}" fill="url(#g)"/>
    <polyline points="${pts}" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round"/>
    ${labels}
  </svg>
  <div class="legend">每日所有模型调用次数之和；最新一天：<b>${fmtCompact(totals[n-1])}</b> 次</div>`;
}

// ---------- table ----------
function renderTable(){
  const f = filtered();
  const head = [
    ["#", "rank"], ["模型", "model_name"], ["厂商", "provider"],
    ["调用次数", "count"], ["Prompt Tokens", "prompt_tokens"],
    ["Completion Tokens", "completion_tokens"], ["总 Tokens", "total_tokens"],
    ["推理 Tokens", "reasoning_tokens"], ["变体", "variants"],
  ];
  const th = head.map(([t,k])=>`<th data-k="${k}">${t}${state.sort===k?(state.dir<0?" ▼":" ▲"):""}</th>`).join("");
  const body = f.slice(0, state.topn).map((r,i)=>{
    const c = provColor(r.provider);
    const chg = (r.change==null) ? '<span class="chg-na">—</span>'
      : (r.change>=0 ? `<span class="chg-up">▲${r.change}%</span>` : `<span class="chg-down">▼${Math.abs(r.change)}%</span>`);
    const variants = (r.variants||[]).map(v=>`<span class="prov">${v}</span>`).join(" ");
    return `<tr>
      <td class="rank">${i+1}</td>
      <td title="${r.model_permaslug}">${r.model_name}</td>
      <td><span class="pill" style="background:${c}">${r.provider_alias||r.provider}</span></td>
      <td class="num">${fmtInt(r.count)} ${chg}</td>
      <td class="num">${fmtInt(r.prompt_tokens)}</td>
      <td class="num">${fmtInt(r.completion_tokens)}</td>
      <td class="num">${fmtInt(r.total_tokens)}</td>
      <td class="num">${fmtInt(r.reasoning_tokens)}</td>
      <td>${variants}</td>
    </tr>`;
  }).join("");
  $("tableWrap").innerHTML =
    `<table><thead><tr>${th}</tr></thead><tbody>${body||'<tr><td colspan="9" style="text-align:center;color:var(--muted)">无匹配数据</td></tr>'}</tbody></table>`;
  document.querySelectorAll("thead th").forEach(thEl=>{
    thEl.onclick = ()=>{
      const k = thEl.dataset.k;
      if (state.sort===k) state.dir *= -1;
      else { state.sort=k; state.dir = (k==="model_name")?1:-1; }
      renderBars(); renderTable();
    };
  });
}

// ---------- events ----------
$("search").addEventListener("input", e=>{ state.search=e.target.value; renderBars(); renderTable(); });
$("provider").addEventListener("change", e=>{ state.provider=e.target.value; renderBars(); renderTable(); });
$("sort").addEventListener("change", e=>{ state.sort=e.target.value; state.dir=(state.sort==="model_name")?1:-1; renderBars(); renderTable(); });
$("topn").addEventListener("change", e=>{ state.topn=+e.target.value; renderBars(); renderTable(); });

init();
</script>
</body>
</html>
